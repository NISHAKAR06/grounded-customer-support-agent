name: Release Packaging & Verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-and-verify:
    name: Build Distribution & Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build Python Package Distribution
        run: |
          python -m build

      - name: Build Production Docker Image
        run: |
          docker build -t customer-support-agent:${{ github.ref_name }} .

      - name: Verify Container Startup
        run: |
          docker run -d --name agent-smoke -p 8000:8000 customer-support-agent:${{ github.ref_name }}
          sleep 5
          docker logs agent-smoke
          curl --fail http://localhost:8000/health || exit 1
          docker stop agent-smoke
